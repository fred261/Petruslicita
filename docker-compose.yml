services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: petrus
      POSTGRES_PASSWORD: petrus
      POSTGRES_DB: petrus_licitacao
    ports:
      - "5432:5432"
    volumes:
      - petrus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petrus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - petrus_redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: petrus
      MINIO_ROOT_PASSWORD: petrus12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - petrus_minio_data:/data

volumes:
  petrus_postgres_data:
  petrus_redis_data:
  petrus_minio_data:
