# Blueprint do Render para o Petrus Licitação.
#
# Cobre os dois serviços web (API + frontend). O Redis (Key Value) fica de fora
# deste blueprint de propósito — crie-o manualmente no painel do Render (Key
# Value > Novo) e cole a "Internal Connection String" resultante na variável
# REDIS_URL da API. Isso evita depender de uma sintaxe de blueprint para Redis
# que muda entre versões do Render; criar o Key Value manualmente leva menos de
# um minuto e não tem esse risco.
#
# O banco de dados é o Neon (externo) — não há bloco `databases:` aqui.
# Cole a "Connection String" do Neon (com ?sslmode=require) em DATABASE_URL.
#
# Depois de importar este blueprint, revise os planos (`plan:`) de cada
# serviço no painel — os valores abaixo são o piso pago recomendado, ajuste
# para cima conforme o volume real de uso.

services:
  - type: web
    name: petrus-api
    runtime: node
    plan: standard
    region: oregon
    branch: main
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @petrus/shared build &&
      pnpm --filter @petrus/api build &&
      pnpm --filter @petrus/api prisma:deploy
    startCommand: node apps/api/dist/src/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # connection string do Neon, com ?sslmode=require
      - key: REDIS_URL
        sync: false # internal connection string do Key Value criado manualmente
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: TOTP_ISSUER
        value: "Petrus Licitação"
      - key: LOGIN_MAX_FAILED_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"
      - key: WEB_URL
        sync: false # URL pública do serviço petrus-web, ex.: https://petrus-web.onrender.com
      - key: PNCP_BASE_URL
        value: "https://pncp.gov.br/api/consulta"
      - key: CNPJ_LOOKUP_PRIMARY_URL
        value: "https://brasilapi.com.br/api/cnpj/v1"
      - key: CNPJ_LOOKUP_FALLBACK_URL
        value: "https://publica.cnpj.ws/cnpj"
      - key: EMAIL_FROM
        sync: false # ex.: nao-responda@brpetrus.com.br, precisa bater com o domínio verificado no Resend
      - key: RESEND_API_KEY
        sync: false
      # Storage: Cloudflare R2 (ver DEPLOY.md item 3)
      - key: S3_BUCKET
        value: "brpetrus-documentos"
      - key: S3_REGION
        value: "auto" # valor fixo exigido pelo R2, não é uma região real
      - key: S3_ENDPOINT
        sync: false # https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"

  - type: web
    name: petrus-web
    runtime: static
    branch: main
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @petrus/shared build &&
      pnpm --filter @petrus/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false # URL pública da API + /api, ex.: https://petrus-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
